<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Coordinates</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
    --red: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.live { background: var(--green); box-shadow: 0 0 0 0 rgba(74,222,128,0.6); animation: pulse 2s infinite; }
  .dot.error { background: var(--red); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .status { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px;
  }
  .value {
    font-size: 26px; font-weight: 700; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums; line-height: 1.2; word-break: break-all;
  }
  .value.dms { font-size: 22px; }
  .sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
  button {
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--accent); background: transparent;
    border: 1px solid var(--card-border); border-radius: 10px;
    padding: 7px 14px; cursor: pointer; transition: transform 0.1s;
  }
  button:active { transform: scale(0.96); }
  button.copied { color: var(--green); border-color: var(--green); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; text-align: center; color: var(--text); }
  a.action-link {
    flex: 1; text-align: center; text-decoration: none;
    border: 1px solid var(--card-border); border-radius: 10px;
    padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--accent);
  }
  .error-box {
    background: var(--card); border: 1px solid var(--red);
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
    font-size: 14px; line-height: 1.5;
  }
  .error-actions { display: flex; gap: 10px; margin-top: 14px; }
  .error-actions button { flex: 1; text-align: center; }
  button.primary {
    background: var(--accent); border-color: transparent;
    color: #0b1220; font-weight: 700; font-size: 14px; padding: 10px 14px;
  }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; line-height: 1.5; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 10px;
    font: inherit; font-size: 14px; font-weight: 600;
    color: var(--muted); background: var(--card);
    border: 1px solid var(--card-border); border-radius: 12px; cursor: pointer;
  }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .south-screen {
    min-height: calc(100dvh - 190px);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 16px 12px 18px; gap: 14px;
  }
  .compass-wrap { width: min(84vw, 360px); }
  #compassSvg { width: 100%; height: auto; display: block; }
  .c-ring { fill: none; stroke: var(--card-border); stroke-width: 2; }
  .c-tick.minor { stroke: var(--card-border); stroke-width: 2; }
  .c-tick.major { stroke: var(--muted); stroke-width: 3; }
  .c-card { font-size: 26px; font-weight: 700; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
  .c-card.s { fill: var(--accent); font-size: 30px; }
  .c-inter { font-size: 15px; font-weight: 600; fill: var(--muted); opacity: 0.75; text-anchor: middle; dominant-baseline: central; }
  .c-lubber { fill: var(--accent); }
  .c-head { fill: var(--accent); }
  .c-tail { fill: var(--muted); opacity: 0.85; }
  .c-scp-line { stroke: var(--text); stroke-width: 2.5; stroke-dasharray: 1.5 8; stroke-linecap: round; opacity: 0.9; }
  .c-pivot { fill: var(--card); stroke: var(--muted); stroke-width: 3; }
  .c-star-shape { fill: var(--text); }
  .readouts { display: flex; gap: 10px; width: 100%; }
  .readout {
    flex: 1; background: var(--bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 10px 12px; text-align: center;
  }
  .r-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
  .r-value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .south-screen #compassBtn { width: 100%; }
  .south-screen .hint { margin-top: 0; }
  .placeholder { color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="dot" id="dot"></span>
    <h1>Coordinates</h1>
    <span class="status" id="status">starting…</span>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabPosition" type="button">Position</button>
    <button class="tab" id="tabSouth" type="button">South</button>
  </div>

  <div id="screenPosition">
  <div class="error-box" id="errorBox" hidden>
    <span id="errorText"></span>
    <div class="error-actions">
      <button id="fixBtn" type="button" class="primary">Request location now</button>
      <button id="retryBtn" type="button">Reload page</button>
    </div>
  </div>

  <div class="card">
    <div class="card-label">
      <span>Latitude</span>
      <button id="copyLat">Copy</button>
    </div>
    <div class="value" id="latDec"><span class="placeholder">—</span></div>
    <div class="value dms" id="latDms" style="margin-top:6px"><span class="placeholder">—</span></div>
  </div>

  <div class="card">
    <div class="card-label">
      <span>Longitude</span>
      <button id="copyLng">Copy</button>
    </div>
    <div class="value" id="lngDec"><span class="placeholder">—</span></div>
    <div class="value dms" id="lngDms" style="margin-top:6px"><span class="placeholder">—</span></div>
  </div>

  <div class="card">
    <div class="card-label"><span>Details</span></div>
    <div class="meta">
      <span>Accuracy <b id="accuracy">—</b></span>
      <span>Altitude <b id="altitude">—</b></span>
      <span>Updated <b id="updated">—</b></span>
    </div>
  </div>

  <div class="actions">
    <button id="copyBoth">Copy Both</button>
    <a class="action-link" id="mapLink" href="#" target="_blank" rel="noopener">Open in Maps</a>
  </div>

  <p class="hint">Updates live while open. Tip: in Safari, tap Share → “Add to Home Screen” to use it like an app.</p>
  </div>

  <div id="screenSouth" class="south-screen" hidden>
    <div class="compass-wrap">
      <svg id="compassSvg" viewBox="0 0 400 400" role="img" aria-label="Compass dial; needle points true south">
        <circle class="c-ring" cx="200" cy="200" r="186"/>
        <g id="cTicks"></g>
        <text class="c-card" x="200" y="44">N</text>
        <text class="c-card" x="356" y="200">E</text>
        <text class="c-card s" x="200" y="356">S</text>
        <text class="c-card" x="44" y="200">W</text>
        <text class="c-inter" x="312" y="88">NE</text>
        <text class="c-inter" x="312" y="312">SE</text>
        <text class="c-inter" x="88" y="312">SW</text>
        <text class="c-inter" x="88" y="88">NW</text>
        <path class="c-lubber" d="M200 5 L191 25 L209 25 Z"/>
        <g id="cNeedle">
          <path class="c-tail" d="M200 374 L196 212 L204 212 Z"/>
          <path class="c-head" d="M200 30 L192.5 212 L207.5 212 Z"/>
          <line class="c-scp-line" x1="200" y1="194" x2="200" y2="70"/>
          <circle class="c-pivot" cx="200" cy="200" r="8"/>
          <path class="c-star-shape" transform="translate(200,52)" d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6 Z"/>
        </g>
      </svg>
    </div>

    <div class="readouts">
      <div class="readout">
        <span class="r-label">Heading</span>
        <span class="r-value" id="headingVal">—</span>
      </div>
      <div class="readout">
        <span class="r-label">SCP altitude</span>
        <span class="r-value" id="scpAlt">—</span>
      </div>
    </div>

    <button id="compassBtn" type="button" class="primary" hidden>Enable compass</button>
    <p class="hint" id="compassHint"></p>
  </div>
</div>

<script>
(function () {
  var dot = document.getElementById('dot');
  var statusEl = document.getElementById('status');
  var errorBox = document.getElementById('errorBox');
  var watchId = null;

  function toDMS(deg, isLat) {
    var dir = isLat ? (deg >= 0 ? 'N' : 'S') : (deg >= 0 ? 'E' : 'W');
    var abs = Math.abs(deg);
    var d = Math.floor(abs);
    var mFloat = (abs - d) * 60;
    var m = Math.floor(mFloat);
    var s = (mFloat - m) * 60;
    if (s >= 59.95) { s = 0; m += 1; }
    if (m >= 60) { m = 0; d += 1; }
    return d + '° ' + m + '′ ' + s.toFixed(2) + '″ ' + dir;
  }

  function setText(id, text) { document.getElementById(id).textContent = text; }

  function fmtTime(d) {
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function render(pos) {
    var lat = pos.coords.latitude;
    var lng = pos.coords.longitude;
    setText('latDec', lat.toFixed(6) + '°');
    setText('lngDec', lng.toFixed(6) + '°');
    setText('latDms', toDMS(lat, true));
    setText('lngDms', toDMS(lng, false));
    setText('accuracy', '± ' + Math.round(pos.coords.accuracy) + ' m');
    setText('altitude', pos.coords.altitude != null ? pos.coords.altitude.toFixed(1) + ' m' : '—');
    lastLat = lat;
    updateScpAlt();
    setText('updated', fmtTime(pos.timestamp ? new Date(pos.timestamp) : new Date()));
    document.getElementById('mapLink').href =
      'https://www.google.com/maps?q=' + lat.toFixed(7) + ',' + lng.toFixed(7);
    dot.classList.remove('error');
    dot.classList.add('live');
    statusEl.textContent = 'live';
    errorBox.hidden = true;
  }

  function iosVersion() {
    var m = navigator.userAgent.match(/OS ([0-9_]+) like Mac/i) || navigator.userAgent.match(/CPU OS ([0-9_]+)/i);
    return m ? m[1].replace(/_/g, '.') : '?';
  }

  function fail(err) {
    dot.classList.remove('live');
    dot.classList.add('error');
    statusEl.textContent = 'error';
    var msg;
    if (err.code === err.PERMISSION_DENIED) {
      msg = 'iOS has locked this site as “denied” — once that happens the pop-up never appears again. Reset it: Settings → Safari → scroll to the very bottom → “Clear History and Website Data”. Then open this page in a normal Safari tab (no “Private” label) and tap “Request location now”.';
    } else if (err.code === err.POSITION_UNAVAILABLE) {
      msg = 'Position unavailable. Move to open sky / away from thick walls and try again.';
    } else {
      msg = 'Timed out getting a fix. Try again — GPS can take a moment outdoors.';
    }
    var diag = 'Diagnostics — ' +
      (window.isSecureContext ? 'HTTPS OK' : 'NOT SECURE — needs HTTPS') +
      ' · ' + (window.navigator.standalone === true ? 'home-screen app' : 'Safari tab') +
      ' · error ' + (err.code != null ? err.code : '?') +
      (err.message ? ' (“' + err.message + '”)' : '') +
      ' · iOS ' + iosVersion();
    var finish = function (state) {
      document.getElementById('errorText').textContent = msg + ' ' + diag + ' · permission state: ' + state;
      errorBox.hidden = false;
    };
    if (navigator.permissions && navigator.permissions.query) {
      try {
        navigator.permissions.query({ name: 'geolocation' }).then(
          function (p) { finish(p.state); },
          function () { finish('hidden by iOS'); }
        );
        return;
      } catch (e) { /* fall through */ }
    }
    finish('hidden by iOS');
  }

  if (!('geolocation' in navigator)) {
    fail({ code: 99, message: 'This browser does not support geolocation.' });
    return;
  }

  watchId = navigator.geolocation.watchPosition(render, fail, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 15000
  });

  function copy(text, btn) {
    if (!text || text === '—') return;
    function done() {
      var orig = btn.textContent;
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(function () { btn.textContent = orig; btn.classList.remove('copied'); }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.getElementById('copyLat').addEventListener('click', function () {
    copy(document.getElementById('latDec').textContent + '\n' + document.getElementById('latDms').textContent, this);
  });
  document.getElementById('copyLng').addEventListener('click', function () {
    copy(document.getElementById('lngDec').textContent + '\n' + document.getElementById('lngDms').textContent, this);
  });
  var tabPos = document.getElementById('tabPosition');
  var tabSouth = document.getElementById('tabSouth');
  var screenPos = document.getElementById('screenPosition');
  var screenSouth = document.getElementById('screenSouth');
  function showScreen(which) {
    var south = which === 'south';
    tabPos.classList.toggle('active', !south);
    tabSouth.classList.toggle('active', south);
    screenPos.hidden = south;
    screenSouth.hidden = !south;
  }
  tabPos.addEventListener('click', function () { showScreen('position'); });
  tabSouth.addEventListener('click', function () { showScreen('south'); });

  document.getElementById('retryBtn').addEventListener('click', function () { location.reload(); });

  document.getElementById('fixBtn').addEventListener('click', function () {
    var btn = this;
    btn.textContent = 'Requesting…';
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        render(pos);
        btn.textContent = 'Location enabled';
      },
      function (err) {
        btn.textContent = 'Request location now';
        fail(err);
      },
      { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 }
    );
  });

  document.getElementById('copyBoth').addEventListener('click', function () {
    copy(
      'Lat: ' + document.getElementById('latDec').textContent + ' (' + document.getElementById('latDms').textContent + ')\n' +
      'Lng: ' + document.getElementById('lngDec').textContent + ' (' + document.getElementById('lngDms').textContent + ')',
      this
    );
  });

  /* ---- South screen: working compass, needle points true south ---- */
  var lastLat = null;
  var smoothH = null;
  var gotHeading = false;
  var needleEl = document.getElementById('cNeedle');
  var headingValEl = document.getElementById('headingVal');
  var scpAltEl = document.getElementById('scpAlt');
  var compassBtn = document.getElementById('compassBtn');
  var compassHint = document.getElementById('compassHint');

  needleEl.setAttribute('transform', 'rotate(180 200 200)'); // default: pointing down = south on screen

  // dial ticks every 10°, majors every 30°
  (function () {
    var parts = [];
    for (var deg = 0; deg < 360; deg += 10) {
      var rad = deg * Math.PI / 180;
      var major = deg % 30 === 0;
      var r1 = major ? 162 : 172;
      parts.push('<line x1="' + (200 + r1 * Math.sin(rad)).toFixed(1) +
        '" y1="' + (200 - r1 * Math.cos(rad)).toFixed(1) +
        '" x2="' + (200 + 184 * Math.sin(rad)).toFixed(1) +
        '" y2="' + (200 - 184 * Math.cos(rad)).toFixed(1) +
        '" class="c-tick ' + (major ? 'major' : 'minor') + '"/>');
    }
    document.getElementById('cTicks').innerHTML = parts.join('');
  })();

  function cardinal(h) {
    var names = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    var hh = ((h % 360) + 360) % 360;
    return names[Math.round(hh / 22.5) % 16];
  }

  function drawCompass() {
    // needle drawn pointing up; rotate (180 - heading) so the tip lands on true south
    var a = (180 - smoothH + 360) % 360;
    needleEl.setAttribute('transform', 'rotate(' + a.toFixed(1) + ' 200 200)');
    var h = ((Math.round(smoothH) % 360) + 360) % 360;
    headingValEl.textContent = h + '° ' + cardinal(h);
  }

  function refreshHint() {
    var alt = lastLat != null ? Math.round(Math.abs(lastLat)) : null;
    var scp = 'Aim the needle at the sky, then tilt up ≈ ' + (alt != null ? alt + '°' : 'your latitude') +
      ' — the faint star σ Octantis sits ~1° from the South Celestial Pole.';
    compassHint.textContent = (gotHeading ? 'Live compass. ' : 'Waiting for compass… ') + scp;
  }

  function updateScpAlt() {
    if (lastLat == null) { scpAltEl.textContent = '—'; return; }
    scpAltEl.textContent = '≈ ' + Math.round(Math.abs(lastLat)) + '° above horizon';
    refreshHint();
  }

  // ---- Diagnostics: track what the device actually reports ----
  var probe = { events: 0, hasAlpha: false, hasTrueHeading: false };
  var probed = false;
  var isStandalone = (typeof navigator.standalone === 'boolean') ? navigator.standalone
    : (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var hasPermAPI = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';

  function onOrientation(e) {
    probe.events++;
    if (typeof e.alpha === 'number' && isFinite(e.alpha)) probe.hasAlpha = true;
    if (typeof e.webkitCompassHeading === 'number' && isFinite(e.webkitCompassHeading)) probe.hasTrueHeading = true;
    var h = null;
    if (typeof e.webkitCompassHeading === 'number' && isFinite(e.webkitCompassHeading)) {
      h = e.webkitCompassHeading; // iOS home-screen app, true-north reference
    } else if (typeof e.alpha === 'number' && isFinite(e.alpha)) {
      var angle = 0;
      try {
        angle = (screen.orientation && typeof screen.orientation.angle === 'number')
          ? screen.orientation.angle
          : (window.orientation || 0);
      } catch (err) { /* stay 0 */ }
      h = (((360 - e.alpha + angle) % 360) + 360) % 360; // Safari tab fallback
    }
    if (h == null) return;
    if (!gotHeading) {
      gotHeading = true;
      compassBtn.hidden = true;
      refreshHint();
    }
    if (smoothH == null) {
      smoothH = h;
    } else {
      var d = ((h - smoothH + 540) % 360) - 180; // shortest path, no 359°→0° spin
      smoothH = (smoothH + d * 0.3 + 360) % 360;
    }
    drawCompass();
  }

  window.addEventListener('deviceorientation', onOrientation, true);

  function describeProbe(prefix) {
    var bit;
    if (probe.events === 0) bit = 'no motion events (permission not active)';
    else if (probe.hasTrueHeading) bit = 'true compass heading OK';
    else if (probe.hasAlpha) bit = 'magnetic heading only — true south may be a few degrees off';
    else bit = 'events fire but sensor values blocked';
    return (prefix ? prefix + ' ' : '') +
      'Diagnostics: ' + bit + ' · ' + probe.events + ' events · '
      + (isStandalone ? 'home-screen app' : 'Safari tab') + '.';
  }

  function runProbe(note) {
    probed = true;
    probe.events = 0; probe.hasAlpha = false; probe.hasTrueHeading = false;
    if (!gotHeading) compassHint.textContent = note || 'Waiting for compass…';
    setTimeout(function () {
      if (!gotHeading) compassHint.textContent = describeProbe(note);
    }, 4000);
  }

  compassBtn.addEventListener('click', function () {
    if (hasPermAPI) {
      DeviceOrientationEvent.requestPermission().then(
        function (res) {
          if (res === 'granted') runProbe('Granted — starting…');
          else runProbe('Permission declined (or blocked). If no prompt appeared, reset Motion & Orientation in iPhone Settings → Coordinates, then tap again.');
        },
        function (err) {
          runProbe('Permission request failed' + (err && err.message ? ' (' + err.message + ')' : '') + '.');
        }
      );
    } else {
      runProbe('This browser has no motion-permission API. '
        + (isStandalone ? 'Try tapping again.' : 'Open the app from your Home Screen instead of a Safari tab.'));
    }
  });

  refreshHint();
  setTimeout(function () {
    if (!gotHeading) {
      compassBtn.hidden = false;
      if (!probed) runProbe('Waiting for compass…');
    }
  }, 1500);
})();
</script>
</body>
</html>
